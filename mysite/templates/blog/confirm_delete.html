<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog | Confirmar eliminación</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body class="min-h-screen bg-gradient-to-br from-rose-50 via-white to-red-100 text-slate-900" style="font-family: 'Space Grotesk', sans-serif;">
    <header class="mx-auto flex w-full max-w-2xl items-center justify-between px-6 py-8">
        <h1 class="text-3xl font-bold text-rose-700">Eliminar publicacion</h1>
        <a href="{% url 'post_list' %}" class="rounded-lg border border-slate-300 px-4 py-2 text-sm font-semibold transition hover:bg-slate-100">Cancelar y volver</a>
    </header>

    <main class="mx-auto w-full max-w-2xl px-6 pb-12">
        <section class="rounded-2xl border border-rose-200 bg-white p-8 shadow-xl">
            <p class="text-lg leading-relaxed text-slate-700">Seguro que deseas eliminar la publicacion <span class="font-bold text-slate-900">"{{ post.title }}"</span>?</p>

            <form method="post" class="mt-6 flex flex-wrap gap-3">
                {% csrf_token %}
                <button type="submit" class="rounded-xl bg-rose-600 px-6 py-3 text-sm font-bold uppercase tracking-wide text-white transition hover:bg-rose-500">
                    Si, eliminar
                </button>
                <a href="{% url 'post_list' %}" class="rounded-xl border border-slate-300 px-6 py-3 text-sm font-bold uppercase tracking-wide text-slate-700 transition hover:bg-slate-100">
                    No, volver
                </a>
            </form>
        </section>
    </main>
</body>
</html>
