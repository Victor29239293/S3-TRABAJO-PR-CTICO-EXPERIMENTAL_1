<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog | Detalle</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body class="min-h-screen bg-gradient-to-br from-slate-900 via-emerald-950 to-slate-900 text-slate-100" style="font-family: 'Space Grotesk', sans-serif;">
    <header class="mx-auto flex w-full max-w-4xl items-center justify-between px-6 py-8">
        <h1 class="text-3xl font-bold">Detalle de publicacion</h1>
        <a href="{% url 'post_list' %}" class="rounded-lg border border-emerald-300/40 px-4 py-2 text-sm font-semibold text-emerald-100 transition hover:bg-emerald-400/20">
            Volver al listado
        </a>
    </header>

    <main class="mx-auto w-full max-w-4xl px-6 pb-12">
        <article class="rounded-3xl border border-white/10 bg-white/5 p-8 shadow-2xl backdrop-blur-sm">
            <h2 class="text-4xl font-bold leading-tight">{{ post.title }}</h2>
            <p class="mt-6 whitespace-pre-line leading-8 text-slate-200">{{ post.content }}</p>
        </article>

        <section class="mt-6 flex flex-wrap gap-3">
            <a href="" class="rounded-xl bg-amber-400 px-4 py-2 text-sm font-bold text-amber-950 transition hover:-translate-y-0.5 hover:bg-amber-300">
                Editar
            </a>
            <a href="" class="rounded-xl bg-rose-500 px-4 py-2 text-sm font-bold text-white transition hover:-translate-y-0.5 hover:bg-rose-400">
                Eliminar
            </a>
        </section>
    </main>
</body>
</html>
