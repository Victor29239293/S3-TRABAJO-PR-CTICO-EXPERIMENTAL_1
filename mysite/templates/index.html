<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog | Inicio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body class="min-h-screen bg-slate-950 text-slate-100" style="font-family: 'Space Grotesk', sans-serif;">
    <main class="relative isolate flex min-h-screen items-center justify-center overflow-hidden px-6">
        <div class="absolute -left-32 top-10 h-72 w-72 rounded-full bg-cyan-500/30 blur-3xl"></div>
        <div class="absolute -right-16 bottom-0 h-72 w-72 rounded-full bg-emerald-500/30 blur-3xl"></div>

        <section class="relative z-10 w-full max-w-2xl rounded-3xl border border-white/10 bg-white/5 p-10 text-center shadow-2xl backdrop-blur">
            <p class="mb-3 text-xs uppercase tracking-[0.25em] text-cyan-200">Django Practice</p>
            <h1 class="text-4xl font-bold leading-tight">Tu espacio para practicar CRUD de Blog</h1>
            <p class="mt-4 text-slate-300">Crea, edita y organiza publicaciones con una interfaz limpia para enfocarte en aprender.</p>
            <div class="mt-8">
                <a href="" class="rounded-xl bg-cyan-400 px-6 py-3 text-sm font-bold uppercase tracking-wide text-slate-900 transition hover:bg-cyan-300">
                    Ir al blog
                </a>
            </div>
        </section>
    </main>

</html>
